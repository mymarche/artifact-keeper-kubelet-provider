[package]
name = "artifact-keeper-kubelet-provider"
version = "0.1.0"
description = "Kubelet image credential provider that exchanges pod ServiceAccount tokens for Artifact Keeper registry credentials"
edition = "2024"
license = "MIT"
repository = "https://github.com/artifact-keeper/artifact-keeper-kubelet-provider"
rust-version = "1.88.0"
publish = false

[[bin]]
name = "ak-kubelet-provider"
path = "src/main.rs"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Blocking HTTP, rustls with ring, no async runtime (design D2).
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
# Mozilla roots as DER certificates, so an extra CA bundle can be appended.
webpki-root-certs = "1"

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
