# Kubelet image credential provider configuration for Artifact Keeper.
#
# Pass to the kubelet with:
#   --image-credential-provider-config=/etc/kubernetes/credential-provider-config.yaml
#   --image-credential-provider-bin-dir=/usr/libexec/kubernetes/kubelet-plugins/credential-provider/exec
# and place the `ak-kubelet-provider` binary in that bin dir.
#
# Requires Kubernetes 1.34+ (KEP-4412, service account tokens for image pulls)
# and the node RBAC grant in rbac.yaml. Verified with a 1.34.3 kubelet.
apiVersion: kubelet.config.k8s.io/v1
kind: CredentialProviderConfig
providers:
  # If the node already has providers (e.g. ecr-credential-provider on EKS),
  # keep them and add this entry alongside.
  - name: ak-kubelet-provider
    # Only images from Artifact Keeper hosts go through this plugin.
    matchImages:
      - "ak.example.com"
      - "ak.example.com:5000"
    # Upper bound if a response ever lacks cacheDuration; the plugin always
    # sets it from the token lifetime.
    defaultCacheDuration: "5m"
    apiVersion: credentialprovider.kubelet.k8s.io/v1
    args:
      - --url=https://ak.example.com
    env:
      # Only for clusters whose issuer is shared with another provider in
      # Artifact Keeper (e.g. several kubeadm clusters on the default issuer).
      # - name: AK_PROVIDER_ID
      #   value: "00000000-0000-0000-0000-000000000000"
      # Private CA for Artifact Keeper's TLS certificate.
      # - name: AK_CA_FILE
      #   value: /etc/kubernetes/pki/artifact-keeper-ca.pem
    tokenAttributes:
      # Must equal the `audience` of the kubernetes provider in Artifact
      # Keeper. Use a dedicated value, NEVER the API server's own audience:
      # a token for the API server would then be accepted by Artifact Keeper,
      # and the token sent to Artifact Keeper would be valid against the API
      # server.
      serviceAccountTokenAudience: artifact-keeper
      # Cache credentials per ServiceAccount, so pods of different
      # ServiceAccounts never share a credential.
      cacheType: ServiceAccount
      # Refuse pulls from pods that have no ServiceAccount token to present.
      requireServiceAccount: true
